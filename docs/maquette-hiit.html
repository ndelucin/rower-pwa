<!doctype html>
<!-- Static mock-up of the HIIT screen (2026-11-15). ?recup shows a recovery interval. Not wired to any data. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette HIIT</title>
<style>
  :root {
    --bg: #0a0d12; --text: #f3f6fa; --muted: #8b97a9;
    --pace: #4fc3f7; --power: #ffb547; --ok: #5cd27a;
    --work: #ff9f43; --rest: #4dd0c8; --easy: #6b7789;
    --u: min(1vw, 1vh);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); font-family: system-ui, Roboto, sans-serif; overflow: hidden; }
  /* Background tint follows the interval type (peripheral vision, brief § 7) */
  body { background: radial-gradient(ellipse at center, var(--tint) 0%, var(--bg) 75%); }
  body.work { --tint: #2a1a0b; --phase: var(--work); }
  body.rest { --tint: #0a2224; --phase: var(--rest); }

  .screen {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto;
    padding: calc(2.5 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-right)) calc(2 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-left));
    column-gap: calc(3 * var(--u));
    font-variant-numeric: tabular-nums;
  }
  .col { display: flex; flex-direction: column; justify-content: space-around; }
  .col.right { text-align: right; }
  .metric .label { font-size: calc(4.6 * var(--u)); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .metric .value { font-size: calc(20 * var(--u)); font-weight: 700; line-height: 1; }
  .metric .unit { font-size: calc(5.5 * var(--u)); color: var(--muted); font-weight: 400; margin-left: .2em; }
  .metric .target { font-size: calc(4.2 * var(--u)); color: var(--ok); }
  .split .value { color: var(--pace); }
  .power .value { color: var(--power); }

  .ring { position: relative; height: 100%; aspect-ratio: 1; align-self: center; }
  .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .phase { font-size: calc(5 * var(--u)); font-weight: 700; letter-spacing: .08em; color: var(--phase); }
  .ring .countdown { font-size: calc(20 * var(--u)); font-weight: 700; line-height: 1.05; color: var(--phase); }
  .ring .next { font-size: calc(4 * var(--u)); color: var(--muted); }

  .bar { grid-column: 1 / -1; margin-top: calc(3 * var(--u)); }
  .track { position: relative; height: calc(8 * var(--u)); border-radius: 99px;
    background: linear-gradient(90deg, #1b2533, #22344a 50%, #1b2533); }
  .zone { position: absolute; top: 0; bottom: 0; background: #5cd27a40; border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #3a4a60; }
  .avg { position: absolute; top: calc(-2 * var(--u)); bottom: calc(-2 * var(--u)); width: calc(1 * var(--u)); background: var(--text); border-radius: 2px; transform: translateX(-50%); opacity: .8; }
  .cursor { position: absolute; top: 50%; width: calc(2.6 * var(--u)); height: calc(12 * var(--u)); border-radius: calc(.8 * var(--u));
    background: var(--pace); box-shadow: 0 0 calc(2 * var(--u)) var(--pace); transform: translate(-50%, -50%); }
  .scale { position: relative; height: calc(5.5 * var(--u)); font-size: calc(4.2 * var(--u)); color: var(--muted); }
  .scale span { position: absolute; transform: translateX(-50%); top: calc(.8 * var(--u)); }
  .scale span:first-child { transform: none; } .scale span:last-child { transform: translateX(-100%); }
  .conn { position: fixed; top: calc(1.5 * var(--u)); right: max(calc(1.5 * var(--u)), env(safe-area-inset-right));
    width: calc(1.8 * var(--u)); height: calc(1.8 * var(--u)); border-radius: 50%; background: var(--ok); }
</style>
</head>
<body>
<div class="screen">
  <div class="col">
    <div class="metric split"><div class="label">Split /500 m</div><div class="value" id="split"></div></div>
    <div class="metric power"><div class="label">Puissance</div><div class="value"><span id="power"></span><span class="unit">W</span></div></div>
  </div>

  <div class="ring">
    <svg viewBox="0 0 100 100" id="frise"></svg>
    <div class="center">
      <div class="phase" id="phase"></div>
      <div class="countdown" id="countdown"></div>
      <div class="next" id="next"></div>
    </div>
  </div>

  <div class="col right">
    <div class="metric"><div class="label">Cadence</div><div class="value"><span id="spm"></span><span class="unit">/min</span></div><div class="target" id="spmTarget"></div></div>
    <div class="metric"><div class="label">Distance</div><div class="value"><span id="dist"></span><span class="unit">m</span></div></div>
  </div>

  <div class="bar">
    <div class="track" id="track">
      <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div>
    </div>
    <div class="scale">
      <span style="left:0">2:30</span><span style="left:25%">2:20</span><span style="left:50%">2:10</span><span style="left:75%">2:00</span><span style="left:100%">1:50</span>
    </div>
  </div>
</div>
<div class="conn"></div>

<script>
// Program: warm-up 2:00, 6 x (effort 0:40 at 2:00 ±3 s, 26-30 spm / recovery 1:00), cool-down 2:00.
const segments = [{ type: 'easy', d: 120 }];
for (let i = 0; i < 6; i++) segments.push({ type: 'work', d: 40, n: i + 1 }, { type: 'rest', d: 60, n: i + 1 });
segments.push({ type: 'easy', d: 120 });
const total = segments.reduce((s, x) => s + x.d, 0);

const recup = location.search.includes('recup');
const state = recup
  ? { t: 120 + 2 * 100 + 40 + 22, split: 146, avg: 148, power: 112, spm: 18, dist: 1640 }   // recovery 3, 22 s in
  : { t: 120 + 2 * 100 + 17, split: 118, avg: 120, power: 214, spm: 28, dist: 1480 };       // effort 3, 17 s in
document.body.className = recup ? 'rest' : 'work';

// Ring = the whole session: one arc per segment, proportional to its duration.
const C = 2 * Math.PI * 44, GAP = 0.8, colors = { easy: 'var(--easy)', work: 'var(--work)', rest: 'var(--rest)' };
let start = 0, html = '', current, currentStart;
for (const s of segments) {
  const len = (s.d / total) * C, end = start + s.d;
  const arc = (from, l, op) => `<circle cx="50" cy="50" r="44" fill="none" stroke="${colors[s.type]}" stroke-width="7" opacity="${op}"
      stroke-dasharray="${Math.max(l - GAP, 0)} ${C}" stroke-dashoffset="${-from}"/>`;
  const from = (start / total) * C;
  if (state.t >= end) html += arc(from, len, 0.9);                       // past
  else if (state.t < start) html += arc(from, len, 0.22);                 // to come
  else {                                                                  // current: fills up
    current = s; currentStart = start;
    html += arc(from, len, 0.22) + arc(from, ((state.t - start) / total) * C + GAP, 1);
  }
  start = end;
}
document.getElementById('frise').innerHTML = html;

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const idx = segments.indexOf(current), nextSeg = segments[idx + 1];
const names = { work: 'Effort', rest: 'Récup', easy: 'Retour au calme' };
document.getElementById('phase').textContent = `${names[current.type].toUpperCase()} ${current.n} / 6`;
document.getElementById('countdown').textContent = fmt(current.d - (state.t - currentStart));
document.getElementById('next').textContent = `ensuite : ${names[nextSeg.type].toLowerCase()} ${nextSeg.n ?? ''} · ${fmt(nextSeg.d)}`;

document.getElementById('split').textContent = fmt(state.split);
document.getElementById('power').textContent = state.power;
document.getElementById('spm').textContent = state.spm;
document.getElementById('spmTarget').textContent = recup ? '' : 'cible 26–30';
document.getElementById('dist').textContent = state.dist.toLocaleString('fr-FR');

// Split bar: 2:30 (left) -> 1:50 (right). Target zone during efforts; average = current interval.
const pos = (s) => `${Math.min(Math.max((150 - s) / 40, 0), 1) * 100}%`;
const track = document.getElementById('track');
if (!recup) track.insertAdjacentHTML('afterbegin', `<div class="zone" style="left:${pos(123)};right:calc(100% - ${pos(117)})"></div>`);
track.insertAdjacentHTML('beforeend', `<div class="avg" style="left:${pos(state.avg)}"></div><div class="cursor" style="left:${pos(state.split)}"></div>`);
</script>
</body>
</html>
