<!doctype html>
<!-- Static mock-up of a programmed session, one phase at a time (2026-11-15). ?s=1..6 picks the moment shown. Not wired to any data. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette HIIT</title>
<style>
  :root {
    --bg: #0a0d12; --text: #f3f6fa; --muted: #8b97a9;
    --pace: #4fc3f7; --power: #ffb547; --ok: #5cd27a;
    --work: #ff9f43; --rest: #4dd0c8; --easy: #6b7789;
    --u: min(1vw, 1vh);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); font-family: system-ui, Roboto, sans-serif; overflow: hidden; }
  /* Background tint follows the interval type (peripheral vision, brief § 7) */
  body { background: radial-gradient(ellipse at center, var(--tint) 0%, var(--bg) 75%); }
  body.work { --tint: #2a1a0b; --phase: var(--work); }
  body.rest { --tint: #0a2224; --phase: var(--rest); }
  body.easy { --tint: #141a23; --phase: #aab6c8; }

  .screen {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto;
    padding: calc(2.5 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-right)) calc(2 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-left));
    column-gap: calc(3 * var(--u));
    font-variant-numeric: tabular-nums;
  }
  .col { display: flex; flex-direction: column; justify-content: space-around; }
  .col.right { text-align: right; }
  .metric .label { font-size: calc(4.6 * var(--u)); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .metric .value { font-size: calc(20 * var(--u)); font-weight: 700; line-height: 1; }
  .metric .unit { font-size: calc(5.5 * var(--u)); color: var(--muted); font-weight: 400; margin-left: .2em; }
  .metric .target { font-size: calc(4.2 * var(--u)); color: var(--ok); }
  .split .value { color: var(--pace); }
  .power .value { color: var(--power); }

  .ring { position: relative; height: 100%; aspect-ratio: 1; align-self: center; }
  .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .phase { font-size: calc(5 * var(--u)); font-weight: 700; letter-spacing: .08em; color: var(--phase); }
  .ring .countdown { font-size: calc(23 * var(--u)); font-weight: 700; line-height: 1.05; color: var(--phase); }

  .bar { grid-column: 1 / -1; margin-top: calc(3 * var(--u)); }
  .track { position: relative; height: calc(8 * var(--u)); border-radius: 99px;
    background: linear-gradient(90deg, #1b2533, #22344a 50%, #1b2533); }
  .zone { position: absolute; top: 0; bottom: 0; background: #5cd27a40; border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #3a4a60; }
  .avg { position: absolute; top: calc(-2 * var(--u)); bottom: calc(-2 * var(--u)); width: calc(1 * var(--u)); background: var(--text); border-radius: 2px; transform: translateX(-50%); opacity: .8; }
  .cursor { position: absolute; top: 50%; width: calc(2.6 * var(--u)); height: calc(12 * var(--u)); border-radius: calc(.8 * var(--u));
    background: var(--pace); box-shadow: 0 0 calc(2 * var(--u)) var(--pace); transform: translate(-50%, -50%); }
  .cursor.out::after { content: attr(data-arrow); position: absolute; top: 50%; transform: translateY(-50%); font-size: calc(6 * var(--u)); color: var(--pace); }
  .cursor.out.left::after { left: calc(3 * var(--u)); } .cursor.out.right::after { right: calc(3 * var(--u)); }
  .scale { position: relative; height: calc(5.5 * var(--u)); font-size: calc(4.2 * var(--u)); color: var(--muted); }
  .scale span { position: absolute; transform: translateX(-50%); top: calc(.8 * var(--u)); }
  .scale span:first-child { transform: none; } .scale span:last-child { transform: translateX(-100%); }
  .conn { position: fixed; top: calc(1.5 * var(--u)); right: max(calc(1.5 * var(--u)), env(safe-area-inset-right));
    width: calc(1.8 * var(--u)); height: calc(1.8 * var(--u)); border-radius: 50%; background: var(--ok); }
</style>
</head>
<body>
<div class="screen">
  <div class="col">
    <div class="metric split"><div class="label">Split /500 m</div><div class="value" id="split"></div></div>
    <div class="metric power"><div class="label">Puissance</div><div class="value"><span id="power"></span><span class="unit">W</span></div></div>
  </div>

  <div class="ring">
    <svg viewBox="0 0 100 100" id="frise"></svg>
    <div class="center">
      <div class="phase" id="phase"></div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>

  <div class="col right">
    <div class="metric"><div class="label">Cadence</div><div class="value"><span id="spm"></span><span class="unit">/min</span></div><div class="target" id="spmTarget"></div></div>
    <div class="metric"><div class="label">Distance</div><div class="value"><span id="dist"></span><span class="unit">m</span></div></div>
  </div>

  <div class="bar">
    <div class="track" id="track">
      <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div>
    </div>
    <div class="scale">
      <span style="left:0">2:30</span><span style="left:25%">2:20</span><span style="left:50%">2:10</span><span style="left:75%">2:00</span><span style="left:100%">1:50</span>
    </div>
  </div>
</div>
<div class="conn"></div>

<script>
// Program: warm-up 5:00, set 1 = Tabata 8 x (20 s effort / 10 s recovery), long recovery 3:00,
// set 2 = same Tabata, cool-down 5:00. The ring shows the CURRENT PHASE only:
// a single segment = one arc that fills up; a block of intervals = one arc per interval.
const tabata = { kind: 'block', reps: 8, work: 20, rest: 10, target: { split: [112, 118], spm: '30–34' } };
const phases = [
  { kind: 'single', type: 'easy', label: 'Échauffement', d: 300 },
  { ...tabata, set: 1 },
  { kind: 'single', type: 'rest', label: 'Récup longue', d: 180 },
  { ...tabata, set: 2 },
  { kind: 'single', type: 'easy', label: 'Retour au calme', d: 300 },
];
// The moments shown (t = seconds into the phase), with plausible rower values.
const moments = {
  1: { phase: 0, t: 170, split: 142, avg: 145, power: 122, spm: 20, dist: 720 },
  2: { phase: 1, t: 72,  split: 112, avg: 113, power: 249, spm: 32, dist: 1450 },
  3: { phase: 1, t: 84,  split: 154, avg: 151, power: 96,  spm: 16, dist: 1490 },
  4: { phase: 2, t: 75,  split: 165, avg: 160, power: 78,  spm: 14, dist: 1760 },
  5: { phase: 3, t: 125, split: 107, avg: 110, power: 284, spm: 34, dist: 2410 },
  6: { phase: 4, t: 60,  split: 150, avg: 148, power: 104, spm: 18, dist: 3050 },
};
const m = moments[new URLSearchParams(location.search).get('s') ?? '2'];
const ph = phases[m.phase];

// Segments of the current phase
const segs = ph.kind === 'single' ? [{ type: ph.type, d: ph.d }]
  : Array.from({ length: ph.reps }, (_, i) => [{ type: 'work', d: ph.work, n: i + 1 }, { type: 'rest', d: ph.rest, n: i + 1 }]).flat();
const total = segs.reduce((a, x) => a + x.d, 0);

const C = 2 * Math.PI * 44, GAP = segs.length > 1 ? 0.8 : 0;
const colors = { easy: '#aab6c8', work: 'var(--work)', rest: 'var(--rest)' };
let start = 0, html = '', cur, curStart;
for (const sg of segs) {
  const len = (sg.d / total) * C, end = start + sg.d, from = (start / total) * C;
  const arc = (l, op) => `<circle cx="50" cy="50" r="44" fill="none" stroke="${colors[sg.type]}" stroke-width="7" opacity="${op}"
      stroke-dasharray="${Math.max(l - GAP, 0)} ${C}" stroke-dashoffset="${-from}"/>`;
  if (m.t >= end) html += arc(len, 0.9);
  else if (m.t < start) html += arc(len, 0.22);
  else { cur = sg; curStart = start; html += arc(len, 0.22) + arc(((m.t - start) / total) * C + GAP, 1); }
  start = end;
}
document.getElementById('frise').innerHTML = html;
document.body.className = cur.type;

const fmt = (x) => `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`;
const label = ph.kind === 'single' ? ph.label.toUpperCase()
  : `S${ph.set} · ${cur.type === 'work' ? 'EFFORT' : 'RÉCUP'} ${cur.n} / ${ph.reps}`;
document.getElementById('phase').textContent = label;
document.getElementById('countdown').textContent = fmt(cur.d - (m.t - curStart));

document.getElementById('split').textContent = fmt(m.split);
document.getElementById('power').textContent = m.power;
document.getElementById('spm').textContent = m.spm;
const inWork = ph.kind === 'block' && cur.type === 'work';
document.getElementById('spmTarget').textContent = inWork ? `cible ${ph.target.spm}` : '';
document.getElementById('dist').textContent = m.dist.toLocaleString('fr-FR');

// Split bar 2:30 -> 1:50. Target zone during efforts; average = current segment; arrow when off scale.
const frac = (x) => (150 - x) / 40, pos = (x) => `${Math.min(Math.max(frac(x), 0), 1) * 100}%`;
const track = document.getElementById('track');
if (inWork) track.insertAdjacentHTML('afterbegin', `<div class="zone" style="left:${pos(ph.target.split[1])};right:calc(100% - ${pos(ph.target.split[0])})"></div>`);
const out = frac(m.split) < 0 ? 'out left" data-arrow="◀' : frac(m.split) > 1 ? 'out right" data-arrow="▶' : '';
track.insertAdjacentHTML('beforeend', `<div class="avg" style="left:${pos(m.avg)}"></div><div class="cursor ${out}" style="left:${pos(m.split)}"></div>`);
</script>
</body>
</html>
