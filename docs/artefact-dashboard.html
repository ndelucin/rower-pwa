<title>RowerBoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap">
<style>
  /* Layout: one column. Summary figures, the split trend across sessions, the session list, then the selected session's curves.
     Dark-first, the same blue night and cyan / amber pair as the RowerMonitor app. */
  :root {
    --bg: #0a0d12; --panel: #121a24; --line: #223042; --text: #eef3f8; --muted: #8b99ab;
    --pace: #4fc3f7; --power: #ffb547; --ok: #5cd27a; --warn: #ffb547; --err: #ff7a70;
    --grid: #1c2938;
    /* Same background as the RowerMonitor start screen: soft glow, faint concentric rings, blue-night gradient.
       Fixed to the viewport (see body); rings are 11vmin apart like the app's 11 units. */
    --bg-image:
      radial-gradient(circle at 50% 30%, rgba(79,195,247,.16) 0, rgba(79,195,247,.05) 28%, transparent 55%),
      repeating-radial-gradient(circle at 50% 30%, transparent 0 11vmin, rgba(79,195,247,.055) 11vmin calc(11vmin + 1.5px)),
      radial-gradient(120% 90% at 50% 0%, #14253a 0, #0c1522 45%, #070a10 100%);
    --font-display: Roboto, "Segoe UI", system-ui, sans-serif;
    --font-body: Roboto, "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f7fa; --panel: #ffffff; --line: #d5dee8; --text: #0f1a26; --muted: #5b6b7e;
      --pace: #0a79ad; --power: #b36a00; --ok: #1d8a3f; --warn: #a45f00; --err: #c0392b; --grid: #e4ebf2;
      --bg-image: none;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f7fa; --panel: #ffffff; --line: #d5dee8; --text: #0f1a26; --muted: #5b6b7e;
    --pace: #0a79ad; --power: #b36a00; --ok: #1d8a3f; --warn: #a45f00; --err: #c0392b; --grid: #e4ebf2;
    --bg-image: none;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); background-image: var(--bg-image); background-attachment: fixed; color: var(--text); font: 15px/1.5 var(--font-body);
    padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  /* Same wordmark as the app: heartbeat line, "Rower" semi-bold, then a light, tinted second word */
  h1 { font-size: 30px; font-weight: 400; line-height: 1; letter-spacing: .03em; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 52px; height: 26px; flex: none; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--pace) 55%, transparent)); }
  .logo path { fill: none; stroke: url(#ecg); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .logo stop { stop-color: var(--pace); }
  .wordmark b { font-weight: 600; }
  .wordmark span { font-weight: 300; color: var(--pace); margin-left: .12em; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
  .source { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .filebtn { font: inherit; font-size: 13px; font-weight: 500; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--pace); }
  button:focus-visible, .filebtn:focus-within, tr:focus-visible { outline: 2px solid var(--pace); outline-offset: 2px; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .banner { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .banner.err { border-left-color: var(--err); }
  .banner b { font-weight: 600; }
  .figures { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .fig { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; min-width: 0; }
  .fig .v { font-family: var(--font-display); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
  .fig .v small { font-size: 16px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .fig .l { font-size: 16px; color: var(--muted); margin-top: 4px; }
  section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font: 11px var(--font-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; min-width: 560px; }
  th { text-align: right; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--grid); }
  tbody tr[aria-selected="true"] { background: var(--grid); box-shadow: inset 3px 0 0 var(--pace); }
  .ex { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 99px; padding: 0 7px; margin-left: 6px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  details { color: var(--muted); font-size: 12px; }
  details pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font: 12px ui-monospace, monospace; color: var(--muted); }
  @media (max-width: 760px) { .figures { grid-template-columns: repeat(2, 1fr); } .fig:last-child { grid-column: 1 / -1; } }
  @media (max-width: 520px) { h1 { font-size: 26px; } .logo { width: 44px; height: 22px; } .fig .v { font-size: 32px; } }
</style>

<main>
  <header class="top">
    <div>
      <h1 class="brand">
        <svg class="logo" viewBox="0 0 64 32" aria-hidden="true"><defs><linearGradient id="ecg" x1="0" x2="1"><stop offset="0" stop-opacity="0"/><stop offset=".25"/><stop offset=".75"/><stop offset="1" stop-opacity="0"/></linearGradient></defs><path d="M1 18H13L16.5 14.5L19.5 18H25L29 4L35 30L39 18H45L48.5 13.5L52 18H63"/></svg>
        <span class="wordmark"><b>Rower</b><span>Board</span></span>
      </h1>
      <div class="source" id="source" role="status">Chargement…</div>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Actualiser depuis Drive</button>
      <label class="filebtn">Importer un fichier<input id="file" type="file" accept=".txt,.json,text/plain,application/json" multiple></label>
    </div>
  </header>

  <div id="banner" hidden></div>

  <div class="figures" id="figures"></div>

  <section>
    <h2>Allure moyenne par séance</h2>
    <div class="card"><div id="trend"></div></div>
  </section>

  <section>
    <h2>Séances</h2>
    <div class="card scroll">
      <table>
        <thead><tr><th>Date</th><th>Durée</th><th>Distance</th><th>Split moyen</th><th>Puissance</th><th>Cadence</th><th>Meilleur 500 m</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section id="detail" hidden>
    <h2 id="detail-title">Séance</h2>
    <div class="card">
      <div class="legend"><span><i class="dot" style="background:var(--pace)"></i>Split /500 m (plus haut = plus rapide)</span><span><i class="dot" style="background:var(--power)"></i>Puissance (W)</span></div>
      <div id="curve-split"></div>
      <div id="curve-power"></div>
    </div>
  </section>

  <details id="diag"><summary>Détails techniques</summary><pre id="diag-text"></pre></details>
</main>

<script>
(() => {
  const SERVER = 'Google Drive';
  // The folder read by the page (no input field: removed on request). Path from My Drive; a folder name or link also works.
  const DEFAULT_FOLDER = 'personnel/RowerMonitor/data';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let sessions = [];      // real sessions (rower-session/1), newest first
  let usingExample = false;
  let selected = null;    // session id
  let loadedAt = null;
  let sourceLabel = '';
  const diag = { files: 0, parsed: 0, failed: [], note: '' };

  // ---------- formatting ----------
  const pad = (n) => String(n).padStart(2, '0');
  const mmss = (s) => (s == null ? '--' : `${Math.floor(s / 60)}:${pad(Math.round(s % 60) === 60 ? 59 : Math.round(s % 60))}`);
  const dur = (s) => { if (s == null) return '--'; const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const r = Math.round(s % 60);
    return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`; };
  const num = (n) => (n == null ? '--' : Math.round(n).toLocaleString('fr-FR'));
  const dateOf = (s) => new Date(s.id);
  const dateFmt = (d, withTime) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + (withTime ? ` · ${pad(d.getHours())}:${pad(d.getMinutes())}` : '');

  // ---------- examples (clearly marked, shown only while Drive has no session) ----------
  function makeExample(daysAgo, minutes, split, power) {
    const start = new Date(Date.now() - daysAgo * 86400000); start.setHours(18, 30, 0, 0);
    const n = minutes * 12; const samples = []; let d = 0;
    for (let i = 1; i <= n; i++) {
      const t = i * 5; const wob = Math.sin(i / 7) * 3 + Math.sin(i / 3) * 1.5;
      const sp = split + wob + (i < 10 ? 12 - i : 0); const w = Math.round(2.8 / Math.pow(sp / 500, 3));
      d += 500 / sp * 5; samples.push({ t, d: Math.round(d * 10) / 10, split: Math.round(sp * 10) / 10, w, spm: 21 + Math.round(wob / 2), strokes: Math.round(t * 0.36) });
    }
    const duration = n * 5;
    return { schema: 'rower-session/1', id: start.toISOString(), example: true, program: { id: 'free', name: 'Séance libre', kind: 'free' },
      summary: { duration, distance: Math.round(d), avgSplit: Math.round(duration * 500 / d * 10) / 10, avgPower: Math.round(samples.reduce((a, x) => a + x.w, 0) / n), avgSpm: 21.4, strokes: Math.round(duration * 0.36) },
      segments: [], samples, records: [{ kind: '500m', value: Math.round((split - 4) * 10) / 10 }] };
  }
  const examples = () => [makeExample(1, 20, 129, 150), makeExample(4, 20, 133, 138), makeExample(8, 30, 137, 128), makeExample(12, 20, 139, 124)];

  // ---------- reading Drive replies (shape not guaranteed: parse defensively) ----------
  function findFileList(x, depth = 0) {
    if (depth > 4 || x == null) return null;
    if (Array.isArray(x)) {
      if (x.length && x.every((o) => o && typeof o === 'object' && (o.id || o.fileId))) return x;
      for (const v of x) { const r = findFileList(v, depth + 1); if (r) return r; }
      return x.length === 0 ? [] : null;
    }
    if (typeof x === 'object') { for (const v of Object.values(x)) { const r = findFileList(v, depth + 1); if (r) return r; } }
    return null;
  }
  function b64ToText(s) {
    const clean = s.replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
    return new TextDecoder().decode(Uint8Array.from(atob(clean), (c) => c.charCodeAt(0)));
  }
  const isSession = (o) => o && typeof o === 'object' && o.schema === 'rower-session/1' && o.id && o.summary;
  function findSession(x, depth = 0) {
    if (x == null || depth > 5) return null;
    if (isSession(x)) return x;
    if (typeof x === 'string') {
      for (const attempt of [() => JSON.parse(x), () => JSON.parse(b64ToText(x))]) {
        try { const o = attempt(); if (isSession(o)) return o; if (o && typeof o === 'object') { const r = findSession(o, depth + 1); if (r) return r; } } catch { /* not this encoding */ }
      }
      return null;
    }
    if (typeof x === 'object') { for (const v of Object.values(x)) { const r = findSession(v, depth + 1); if (r) return r; } }
    return null;
  }

  // ---------- Drive ----------
  const ERR = {
    server_not_connected: ['Google Drive n’est pas connecté.', 'Ajoutez Google Drive dans Réglages, Connecteurs de claude.ai, puis actualisez.'],
    needs_reauth: ['La connexion à Google Drive a expiré.', 'Reconnectez Google Drive dans Réglages, Connecteurs de claude.ai, puis actualisez.'],
    not_in_manifest: ['L’accès à Drive est refusé pour cette page.', 'Touchez « Actualiser depuis Drive » pour redemander l’autorisation.'],
    approval_required: ['L’accès à Drive demande votre accord.', 'Touchez « Actualiser depuis Drive » et autorisez la lecture.'],
    consent_required: ['L’accès à Drive demande votre accord.', 'Touchez « Actualiser depuis Drive » et autorisez la lecture.'],
    blocked_by_policy: ['Votre organisation bloque la lecture de Drive depuis cette page.', ''],
  };

  // One folder level: the child of `parentId` whose name matches (case-insensitive), or null.
  async function findChild(mcp, name, parentId, cacheOpt) {
    const q = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const res = await mcp.callTool(SERVER, 'search_files', { query: `mimeType = 'application/vnd.google-apps.folder' and title contains '${q}' and parentId = '${parentId}' and trashed = false`, pageSize: 20, excludeContentSnippets: true }, cacheOpt);
    const list = findFileList(res.payload ?? res.structuredContent) || [];
    const hit = list.find((f) => String(f.title ?? f.name ?? '').toLowerCase() === name.toLowerCase());
    return hit ? { id: hit.id ?? hit.fileId, name: hit.title ?? hit.name } : null;
  }

  // The folder to read: a Drive link or id is used as is; "a/b/c" is a path from My Drive; a plain name is looked up (first match).
  async function resolveFolder(mcp, spec, cacheOpt) {
    const m = spec.match(/\/folders\/([\w-]+)/) || spec.match(/[?&]id=([\w-]+)/);
    if (m) return { id: m[1], name: null, count: 1 };
    if (/^[\w-]{25,}$/.test(spec)) return { id: spec, name: null, count: 1 };
    if (spec.includes('/')) {
      const parts = spec.split('/').map((p) => p.trim()).filter(Boolean);
      if (!parts.length) return null;
      let parent = 'root';
      for (const part of parts) {
        const f = await findChild(mcp, part, parent, cacheOpt);
        if (!f) return null;
        parent = f.id;
      }
      return { id: parent, name: parts.join(' / '), count: 1 };
    }
    const quoted = spec.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const res = await mcp.callTool(SERVER, 'search_files', { query: `mimeType = 'application/vnd.google-apps.folder' and title = '${quoted}' and trashed = false`, pageSize: 5, excludeContentSnippets: true }, cacheOpt);
    const list = findFileList(res.payload ?? res.structuredContent) || [];
    if (!list.length) return null;
    return { id: list[0].id ?? list[0].fileId, name: list[0].title ?? list[0].name ?? spec, count: list.length };
  }

  async function loadDrive(forceFresh) {
    $('refresh').disabled = true; $('source').hidden = false; $('source').textContent = 'Lecture de Drive…';
    diag.files = 0; diag.parsed = 0; diag.failed = []; diag.note = '';
    let folderName = '';
    const claude = window.claude;
    const mcp = claude && claude.use ? await claude.use('mcp').catch(() => null) : null;
    if (!mcp) {
      sourceLabel = 'Drive indisponible dans cette vue';
      showBanner(false, 'Cette page lit Drive uniquement ouverte dans claude.ai.', 'Vous pouvez quand même importer un fichier de séance avec le bouton ci-dessus.');
    } else {
      try {
        const cacheOpt = forceFresh ? { cache: { refresh: true, staleTime: 60000, gcTime: 300000 } } : { cache: { staleTime: 60000, gcTime: 300000 } };
        const spec = DEFAULT_FOLDER;
        const folder = await resolveFolder(mcp, spec, cacheOpt);
        if (!folder) throw Object.assign(new Error(spec), { code: 'folder_not_found' });
        folderName = folder.name || 'dossier choisi';
        const res = await mcp.callTool(SERVER, 'search_files', { query: `parentId = '${folder.id}' and trashed = false`, pageSize: 100, orderBy: 'modifiedTime desc', excludeContentSnippets: true }, cacheOpt);
        const list = findFileList(res.payload ?? res.structuredContent) || [];
        // Every file of the folder is tried, newest first: a share from Android can arrive under another name
        // (seen: "Séance RowerMonitor", no extension), so the content decides, not the file name.
        const files = list.filter((f) => !String(f.mimeType || '').startsWith('application/vnd.google-apps.')).slice(0, 60);
        diag.files = files.length;
        diag.note = `dossier : ${folder.name ?? folder.id}${folder.count > 1 ? ` (${folder.count} dossiers portent ce nom, le premier est lu)` : ''}\nréponse de recherche : ${list.length} élément(s), clés du premier : ${list[0] ? Object.keys(list[0]).join(', ') : 'aucun'}`;
        const found = [];
        let next = 0;
        const worker = async () => {
          while (next < files.length) {
            const f = files[next++]; const id = f.id ?? f.fileId;
            try {
              const r = await mcp.callTool(SERVER, 'download_file_content', { fileId: id }, { cache: { staleTime: 604800000, gcTime: 604800000 } });
              const s = findSession(r.payload) || findSession(r.structuredContent) || findSession(r.content);
              if (s) { found.push(s); diag.parsed++; } else diag.failed.push(`${f.title ?? f.name} : contenu non reconnu (clés : ${r.payload && typeof r.payload === 'object' ? Object.keys(r.payload).join(', ') : typeof r.payload})`);
            } catch (e) { diag.failed.push(`${f.title ?? f.name} : ${e.code || ''} ${e.message || e}`); }
          }
        };
        await Promise.all([worker(), worker(), worker(), worker()]);
        mergeSessions(found, true);
        loadedAt = new Date();
        sourceLabel = `Google Drive · ${folderName}`;
        hideBanner();
        if (!files.length) showBanner(false, `Aucun fichier dans « ${folderName} ».`, 'Déposez-y une séance depuis l’appli (Enregistrer la séance, puis Drive), puis actualisez.');
        else if (!found.length) showBanner(true, 'Des fichiers ont été trouvés, mais aucun n’est une séance RowerMonitor lisible.', 'Voir les détails techniques en bas de page.');
      } catch (e) {
        const [t, fix] = e.code === 'folder_not_found'
          ? [`Le dossier « ${e.message} » est introuvable dans votre Drive.`, 'Vérifiez que ce dossier existe dans votre Drive.']
          : ERR[e.code] || [`Lecture de Drive impossible (${e.code || 'erreur'}).`, 'Actualisez dans un instant.'];
        sourceLabel = e.code === 'folder_not_found' ? 'Dossier introuvable' : 'Drive non lu';
        showBanner(true, t, fix);
        diag.note = `${e.code || ''} ${e.message || e}`;
      }
    }
    $('refresh').disabled = false;
    render();
  }

  function mergeSessions(list, replaceAll) {
    const map = new Map(replaceAll ? [] : sessions.map((s) => [s.id, s]));
    for (const s of list) map.set(s.id, s);
    sessions = [...map.values()].sort((a, b) => dateOf(b) - dateOf(a));
  }
  function showBanner(isErr, title, fix) {
    const b = $('banner'); b.hidden = false; b.className = 'banner' + (isErr ? ' err' : '');
    b.innerHTML = `<b>${esc(title)}</b> ${esc(fix)}`;
  }
  const hideBanner = () => { $('banner').hidden = true; };

  // ---------- charts (one scale for marks, ticks and labels) ----------
  function lineChart(points, { color, width = 640, height = 170, invert = false, fmt, xFmt, xLabel }) {
    const pts = points.filter((p) => p.y != null);
    if (pts.length < 2) return '<div class="source">Pas assez de points pour tracer.</div>';
    const m = { l: 46, r: 12, t: 10, b: 24 };
    const xs = points.map((p) => p.x); const x0 = Math.min(...xs); const x1 = Math.max(...xs);
    let lo = Math.min(...pts.map((p) => p.y)); let hi = Math.max(...pts.map((p) => p.y));
    const pad2 = (hi - lo || 1) * 0.12; lo -= pad2; hi += pad2;
    const X = (x) => m.l + ((x - x0) / (x1 - x0 || 1)) * (width - m.l - m.r);
    const Y = (y) => { const f = (y - lo) / (hi - lo); return m.t + (invert ? f : 1 - f) * (height - m.t - m.b); };
    const ticks = [0, 0.5, 1].map((f) => lo + f * (hi - lo));
    let g = ticks.map((t) => `<line x1="${m.l}" x2="${width - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`).join('');
    // Break the line where the value is missing (pauses).
    let d = ''; let pen = false;
    for (const p of points) { if (p.y == null) { pen = false; continue; } d += `${pen ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`; pen = true; }
    const dots = pts.length <= 40 ? pts.map((p) => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${color}"/>`).join('') : '';
    const last = pts[pts.length - 1];
    const lastDot = pts.length > 40 ? `<circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="3.5" fill="${color}"/>` : '';
    const xl = [x0, x1].map((x, i) => `<text x="${X(x).toFixed(1)}" y="${height - 6}" text-anchor="${i ? 'end' : 'start'}">${esc(xFmt(x))}</text>`).join('');
    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(xLabel)}">${g}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lastDot}${xl}</svg>`;
  }

  // ---------- render ----------
  function render() {
    const real = sessions.length > 0;
    usingExample = !real;
    const list = real ? sessions : examples();
    if (!list.some((s) => s.id === selected)) selected = list[0]?.id ?? null;
    // The status line (source, count, read time) was removed on request. Only the badge that marks
    // example data stays, so examples are never mistaken for real sessions.
    $('source').innerHTML = usingExample ? '<span class="ex" style="margin-left:0">Exemples : aucune séance lue</span>' : '';
    $('source').hidden = !usingExample;

    const totalDist = list.reduce((a, s) => a + (s.summary.distance || 0), 0);
    const totalTime = list.reduce((a, s) => a + (s.summary.duration || 0), 0);
    const best = list.flatMap((s) => (s.records || []).filter((r) => r.kind === '500m').map((r) => r.value));
    const recent = list.slice(0, 5).map((s) => s.summary.avgSplit).filter((x) => x != null);
    const avgRecent = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : null;
    $('figures').innerHTML = [
      [String(list.length), '', 'Séances'],
      [(totalDist / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }), 'km', 'Distance'],
      [dur(totalTime), '', 'Temps'],
      [best.length ? mmss(Math.min(...best)) : '--', '/500 m', 'Record'],
      [mmss(avgRecent), '/500 m', 'Allure récente'],
    ].map(([v, u, l]) => `<div class="fig"><div class="v">${esc(v)}${u ? `<small>${esc(u)}</small>` : ''}</div><div class="l">${esc(l)}</div></div>`).join('');

    const chrono = [...list].reverse();
    $('trend').innerHTML = lineChart(chrono.map((s, i) => ({ x: i, y: s.summary.avgSplit })), {
      color: 'var(--pace)', invert: true, fmt: mmss, xLabel: 'Split moyen par séance',
      xFmt: (i) => dateFmt(dateOf(chrono[Math.round(i)]), false),
    });

    $('rows').innerHTML = list.map((s) => {
      const r = (s.records || []).find((x) => x.kind === '500m');
      return `<tr tabindex="0" data-id="${esc(s.id)}" aria-selected="${s.id === selected}">
        <td>${esc(dateFmt(dateOf(s), true))}${s.example ? '<span class="ex">exemple</span>' : ''}</td>
        <td>${dur(s.summary.duration)}</td><td>${num(s.summary.distance)} m</td><td>${mmss(s.summary.avgSplit)}</td>
        <td>${num(s.summary.avgPower)} W</td><td>${s.summary.avgSpm != null ? Math.round(s.summary.avgSpm) : '--'} /min</td><td>${r ? mmss(r.value) : '--'}</td></tr>`;
    }).join('');

    const cur = list.find((s) => s.id === selected);
    $('detail').hidden = !cur;
    if (cur) {
      $('detail-title').textContent = `Séance du ${dateFmt(dateOf(cur), true)}`;
      const sm = cur.samples || [];
      $('curve-split').innerHTML = lineChart(sm.map((p) => ({ x: p.t, y: p.split })), { color: 'var(--pace)', invert: true, fmt: mmss, xFmt: dur, xLabel: 'Split au fil de la séance' });
      $('curve-power').innerHTML = lineChart(sm.map((p) => ({ x: p.t, y: p.w })), { color: 'var(--power)', fmt: (v) => `${Math.round(v)} W`, xFmt: dur, xLabel: 'Puissance au fil de la séance' });
    }
    $('diag-text').textContent = [`fichiers « rower-… » trouvés : ${diag.files}`, `lus : ${diag.parsed}`, diag.note, ...diag.failed].filter(Boolean).join('\n') || 'Rien à signaler.';
  }

  // ---------- events ----------
  $('rows').addEventListener('click', (e) => { const tr = e.target.closest('tr'); if (tr) { selected = tr.dataset.id; render(); } });
  $('rows').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const tr = e.target.closest('tr'); if (tr) { e.preventDefault(); selected = tr.dataset.id; render(); } } });
  $('refresh').addEventListener('click', () => loadDrive(true));
  $('file').addEventListener('change', async (e) => {
    const found = [];
    for (const f of e.target.files) { try { const s = findSession(JSON.parse(await f.text())); if (s) found.push(s); } catch { /* not a session file */ } }
    if (found.length) { mergeSessions(found, false); sourceLabel = sourceLabel && sourceLabel !== 'Drive non lu' ? `${sourceLabel} + fichier importé` : 'Fichier importé'; hideBanner(); render(); }
    else showBanner(true, 'Ce fichier n’est pas une séance RowerMonitor.', 'Choisissez un fichier « rower-….json » exporté par l’appli.');
    e.target.value = '';
  });

  render();
  loadDrive(false);
})();
</script>
