<!doctype html>
<!-- Static mock-up of the free-session screen (decided 2026-11-15, see CLAUDE.md § 4). Not wired to any data. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette séance libre</title>
<style>
  :root {
    --bg: #0a0d12; --panel: #141a23; --line: #222b38;
    --text: #f3f6fa; --muted: #8b97a9;
    --pace: #4fc3f7; --power: #ffb547; --ok: #5cd27a; --err: #ff5d5d;
    --u: min(1vw, 1vh);                 /* readable with or without Chrome's address bar */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, Roboto, sans-serif; overflow: hidden; }
  .screen {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: 1fr auto;
    padding: calc(2.5 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-right)) calc(2 * var(--u)) max(calc(3 * var(--u)), env(safe-area-inset-left));
    column-gap: calc(3 * var(--u));
    font-variant-numeric: tabular-nums;
  }
  .col { display: flex; flex-direction: column; justify-content: space-around; }
  .col.right { text-align: right; }
  .metric .label { font-size: calc(4.6 * var(--u)); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .metric .value { font-size: calc(20 * var(--u)); font-weight: 700; line-height: 1; }
  .metric .unit { font-size: calc(5.5 * var(--u)); color: var(--muted); font-weight: 400; margin-left: .2em; }
  .split .value { color: var(--pace); }
  .power .value { color: var(--power); }

  .ring { position: relative; height: 100%; aspect-ratio: 1; align-self: center; }
  .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .label { font-size: calc(4 * var(--u)); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .ring .chrono { font-size: calc(18 * var(--u)); font-weight: 700; line-height: 1; }
  .ring .state { font-size: calc(4.5 * var(--u)); color: var(--power); min-height: 1.2em; }
  /* Controls in the ring: pause while rowing; resume / stop when paused (?pause). No overlay. */
  .controls { display: flex; gap: calc(4 * var(--u)); margin-top: calc(2 * var(--u)); }
  .ctl { width: calc(14 * var(--u)); height: calc(14 * var(--u)); min-width: 48px; min-height: 48px;
    border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: #26303f; }
  .ctl svg { width: 42%; height: 42%; fill: currentColor; }
  .ctl.resume { background: var(--pace); color: var(--bg); }
  .ctl.stop { background: #26303f; color: #ff8a80; box-shadow: inset 0 0 0 calc(.5 * var(--u)) #ff8a8066; }
  .resume, .stop { display: none !important; }
  .paused .resume, .paused .stop { display: grid !important; }
  .paused .ctl.pause { display: none; }
  .paused .chrono { color: var(--muted); }

  .bar { grid-column: 1 / -1; margin-top: calc(3 * var(--u)); }
  .track { position: relative; height: calc(8 * var(--u)); border-radius: 99px;
    background: linear-gradient(90deg, #1b2533, #22344a 50%, #1b2533); }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #3a4a60; }
  .avg { position: absolute; top: calc(-2 * var(--u)); bottom: calc(-2 * var(--u)); width: calc(1 * var(--u)); background: var(--text); border-radius: 2px; transform: translateX(-50%); opacity: .8; }
  .cursor { position: absolute; top: 50%; width: calc(2.6 * var(--u)); height: calc(12 * var(--u)); border-radius: calc(.8 * var(--u));
    background: var(--pace); box-shadow: 0 0 calc(2 * var(--u)) var(--pace); transform: translate(-50%, -50%); }
  .scale { position: relative; height: calc(5.5 * var(--u)); font-size: calc(4.2 * var(--u)); color: var(--muted); }
  .scale span { position: absolute; transform: translateX(-50%); top: calc(.8 * var(--u)); }
  .scale span:first-child { transform: none; } .scale span:last-child { transform: translateX(-100%); }

  .conn { position: fixed; top: calc(1.5 * var(--u)); right: max(calc(1.5 * var(--u)), env(safe-area-inset-right));
    width: calc(1.8 * var(--u)); height: calc(1.8 * var(--u)); border-radius: 50%; background: var(--ok); }
</style>
</head>
<body>
<div class="screen">
  <div class="col">
    <div class="metric split"><div class="label">Split /500 m</div><div class="value">2:06</div></div>
    <div class="metric power"><div class="label">Puissance</div><div class="value">178<span class="unit">W</span></div></div>
  </div>

  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#1b2533" stroke-width="5"/>
      <!-- 1250 / 2000 m = 62.5 % of the circumference (2π·46 ≈ 289) -->
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--pace)" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="180.6 289"/>
    </svg>
    <div class="center">
      <div class="label">Temps écoulé</div>
      <div class="chrono">12:34</div>
      <div class="state"></div>
      <div class="controls">
        <button class="ctl pause" aria-label="Pause"><svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.5" height="8" rx=".5"/><rect x="6" y="1" width="2.5" height="8" rx=".5"/></svg></button>
        <button class="ctl resume" aria-label="Reprendre"><svg viewBox="0 0 10 10"><path d="M2.5 1 L9 5 L2.5 9 Z"/></svg></button>
        <button class="ctl stop" aria-label="Terminer"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx=".8"/></svg></button>
      </div>
    </div>
  </div>

  <div class="col right">
    <div class="metric"><div class="label">Cadence</div><div class="value">22<span class="unit">/min</span></div></div>
    <div class="metric"><div class="label">Distance</div><div class="value">1 250<span class="unit">m</span></div></div>
  </div>

  <!-- Split bar: 2:30 (left) -> 1:50 (right). Position = (150 - split s) / 40. -->
  <div class="bar">
    <div class="track">
      <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div>
      <div class="avg" style="left:55%" title="moyenne 2:08"></div>
      <div class="cursor" style="left:60%" title="instantané 2:06"></div>
    </div>
    <div class="scale">
      <span style="left:0">2:30</span><span style="left:25%">2:20</span><span style="left:50%">2:10</span><span style="left:75%">2:00</span><span style="left:100%">1:50</span>
    </div>
  </div>
</div>
<div class="conn" title="connecté"></div>
<script>if (location.search.includes('pause')) { document.body.classList.add('paused'); document.querySelector('.ring .label').textContent = 'En pause'; }</script>
</body>
</html>
