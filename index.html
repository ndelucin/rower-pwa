<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <title>Rower</title>
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- Common session template (brief § 7). Zones are filled by the layout of the session type. -->
  <main id="screen" class="screen" hidden>
    <header class="banner">
      <div class="banner-title" data-zone="banner"></div>
      <div data-zone="status"></div>
    </header>
    <section class="main" data-zone="main"></section>
    <section class="side" data-zone="side"></section>
    <footer class="progress" data-zone="progress"></footer>
  </main>

  <div id="start" class="start">
    <h1>Rower</h1>
    <button id="btn-ble" disabled>Connecter le rameur <small></small></button>
    <p id="start-msg" class="start-msg" role="status"></p>
    <div class="sim-choice">
      <span>Simulateur :</span>
      <button data-sim="steady">Continu</button>
      <button data-sim="hiit">HIIT</button>
      <button data-sim="rest">Repos</button>
    </div>
  </div>

  <div class="rotate-hint">Tourne le téléphone en paysage</div>
</body>
</html>
