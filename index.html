<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <title>RowerMonitor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui/styles.css">
  <link rel="modulepreload" href="src/ftms.js">
  <link rel="modulepreload" href="src/ftms-encoder.js">
  <link rel="modulepreload" href="src/sim.js">
  <link rel="modulepreload" href="src/ble.js">
  <link rel="modulepreload" href="src/activity.js">
  <link rel="modulepreload" href="src/wakelock.js">
  <link rel="modulepreload" href="src/session.js">
  <link rel="modulepreload" href="src/smooth.js">
  <link rel="modulepreload" href="src/store.js">
  <link rel="modulepreload" href="src/export.js">
  <link rel="modulepreload" href="src/version.js">
  <link rel="modulepreload" href="src/goal.js">
  <link rel="modulepreload" href="src/programs.js">
  <link rel="modulepreload" href="src/engine.js">
  <link rel="modulepreload" href="src/target.js">
  <link rel="modulepreload" href="src/ui/format.js">
  <link rel="modulepreload" href="src/ui/choice.js">
  <link rel="modulepreload" href="src/ui/components.js">
  <link rel="modulepreload" href="src/ui/layouts.js">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- Common session template (docs/ECRAN.md): two metrics on each side, the ring in the centre,
       the split bar at the bottom, a connection indicator. Zones are filled by src/ui/layouts.js. -->
  <main id="screen" class="screen" hidden>
    <section class="zone-left" data-zone="left"></section>
    <section class="zone-center" data-zone="center"></section>
    <section class="zone-right" data-zone="right"></section>
    <footer class="zone-bar" data-zone="bar"></footer>
    <div class="zone-conn" data-zone="conn"></div>
  </main>

  <!-- Session choice: the root screen (logo, connection button, 4 tiles) ; goal picker and programme list reuse these two containers (src/ui/choice.js). -->
  <main id="choice" class="choice" hidden></main>
  <main id="picker" hidden></main>

  <!-- Simulator: development only, shown on the session choice with ?dev in the address. -->
  <div class="sim-choice" id="sim-choice" hidden>
    <span>Simulateur :</span>
    <button data-sim="steady">Continu</button>
    <button data-sim="hiit">HIIT</button>
    <button data-sim="startstop">Arrêts</button>
    <button data-sim="rest">Repos</button>
  </div>

  <div class="rotate-hint">Tourne le téléphone en paysage</div>
</body>
</html>
