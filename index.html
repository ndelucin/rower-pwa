<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <title>RowerMonitor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- Common session template (docs/ECRAN.md): two metrics on each side, the ring in the centre,
       the split bar at the bottom, a connection indicator. Zones are filled by src/ui/layouts.js. -->
  <main id="screen" class="screen" hidden>
    <section class="zone-left" data-zone="left"></section>
    <section class="zone-center" data-zone="center"></section>
    <section class="zone-right" data-zone="right"></section>
    <footer class="zone-bar" data-zone="bar"></footer>
    <div class="zone-conn" data-zone="conn"></div>
  </main>

  <!-- Start screen (docs/ECRAN.md, "Accueil"): v1 = free session only, the choice of session type comes in v2.
       Portrait (default) and landscape; the session screen switches to landscape once connected. -->
  <div id="start" class="start">
    <div class="start-main">
      <div class="hero">
        <svg class="hero-logo" viewBox="0 0 64 32" aria-hidden="true"><defs><linearGradient id="ecg" x1="0" x2="1"><stop offset="0" stop-color="#4fc3f7" stop-opacity="0"/><stop offset=".25" stop-color="#4fc3f7"/><stop offset=".75" stop-color="#4fc3f7"/><stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/></linearGradient></defs><path d="M1 18H13L16.5 14.5L19.5 18H25L29 4L35 30L39 18H45L48.5 13.5L52 18H63" fill="none" stroke="url(#ecg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1 class="wordmark"><b>Rower</b><span>Monitor</span></h1>
      </div>
      <button id="btn-ble" class="btn-connect" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Connecter le rameur
      </button>
      <p id="start-msg" class="start-msg" role="status"></p>
    </div>
    <p id="last-session" class="last-session"></p>
    <!-- Simulator: development only, shown with ?dev in the address. -->
    <div class="sim-choice" id="sim-choice" hidden>
      <span>Simulateur :</span>
      <button data-sim="steady">Continu</button>
      <button data-sim="hiit">HIIT</button>
      <button data-sim="startstop">Arrêts</button>
      <button data-sim="rest">Repos</button>
    </div>
  </div>

  <div class="rotate-hint">Tourne le téléphone en paysage</div>
</body>
</html>
